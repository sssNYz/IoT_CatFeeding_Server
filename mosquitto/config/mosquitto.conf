# Internal listener for the app, plus tests and the fake feeder through 127.0.0.1 only.
listener 1883
# Feeders on the Internet: TLS with our own CA (scripts/make-mqtt-certs.sh), certificate named after PUBLIC_HOST.
# The logins and ACL below apply to every listener.
listener 8883
certfile /mosquitto/certs/mosquitto.crt
keyfile /mosquitto/certs/mosquitto.key
tls_version tlsv1.2
allow_anonymous false
# Both written at container start (docker-compose.yml): logins for backend and feeder01 from .env, and a copy of config/acl.
password_file /mosquitto/passwd
acl_file /mosquitto/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Internal listener for the app (and, bound to localhost only, for tests). TLS on 8883 and feeder logins come with ticket 04.
listener 1883
allow_anonymous false
# Both written at container start (docker-compose.yml): the login from MQTT_BACKEND_PASSWORD, and a copy of config/acl.
password_file /mosquitto/passwd
acl_file /mosquitto/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

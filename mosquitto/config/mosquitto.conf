# Internal listener for the app, plus tests and the fake feeder through 127.0.0.1 only. TLS on 8883 comes with the VPS setup.
listener 1883
allow_anonymous false
# Both written at container start (docker-compose.yml): logins for backend and feeder01 from .env, and a copy of config/acl.
password_file /mosquitto/passwd
acl_file /mosquitto/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
